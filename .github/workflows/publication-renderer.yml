name: PanLigra Publication Renderer Guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  publication-renderer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PanLigra dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile PanLigra modules
        run: |
          python -m py_compile utils.py interactive_engine.py app.py PanLigra.py PanViz.py scientific_records.py panviz_version.py rcsb_pdb.py

      - name: Verify publication renderer and v6 architecture
        run: |
          pytest -q
