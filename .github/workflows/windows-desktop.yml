name: PanLigra Windows Desktop Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/windows-desktop.yml"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install scientific dependencies with micromamba (build machine only)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: panligra-build
          create-args: >-
            python=3.11
            pip
            openbabel=3.2.1
            rdkit
            pycairo
            gemmi
            numpy
            pandas
            scipy
            lxml
            biopython
            networkx
            matplotlib
          init-shell: powershell

      - name: Install Python application and packaging tools
        shell: micromamba-shell {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "streamlit>=1.40,<2" "requests>=2.31,<3" "pyinstaller>=6,<7" pillow
          python -m pip install --no-deps plip==3.0.1
          python -c "import streamlit, plip, openbabel, rdkit, cairo, gemmi; from plip.structure.preparation import PDBComplex; print('Scientific dependencies import OK')"

      - name: Compile application
        shell: micromamba-shell {0}
        run: |
          python -m compileall -q app.py utils.py interactive_engine.py interaction_3d.py scientific_records.py rcsb_pdb.py desktop
          pyinstaller --noconfirm --clean desktop/PanLigra.spec
          if (!(Test-Path "dist/PanLigra/PanLigra.exe")) { throw "Executable missing" }

      - name: Windows launch smoke test
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "$PWD/dist/PanLigra/PanLigra.exe" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/panligra.stdout.txt" -RedirectStandardError "$env:RUNNER_TEMP/panligra.stderr.txt"
          try {
            $ready = $false
            for ($i=0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 2
              if ($proc.HasExited) { break }
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:18763/_stcore/health" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
            }
            if (!$ready) {
              Get-Content "$env:RUNNER_TEMP/panligra.stdout.txt" -ErrorAction SilentlyContinue
              Get-Content "$env:RUNNER_TEMP/panligra.stderr.txt" -ErrorAction SilentlyContinue
              throw "PanLigra did not start on localhost"
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Build user-level Windows installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & "C:/Program Files (x86)/NSIS/makensis.exe" "desktop/PanLigra.nsi"
          if (!(Test-Path "PanLigra-Setup.exe")) { throw "Installer missing" }

      - name: Upload executable and installer
        uses: actions/upload-artifact@v4
        with:
          name: PanLigra-Windows
          path: |
            PanLigra-Setup.exe
            dist/PanLigra/**
          if-no-files-found: error
          retention-days: 30
