name: PanLigra Windows Desktop Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "VERSION.txt"
      - ".github/workflows/windows-desktop.yml"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install scientific dependencies with micromamba (build machine only)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: panligra-build
          create-args: >-
            python=3.11
            pip
            openbabel=3.2.1
            rdkit>=2025.09,<2026
            libblas=*=*openblas
            pycairo
            gemmi
            numpy
            pandas
            scipy
            lxml
            biopython
            networkx
            matplotlib
          init-shell: powershell

      - name: Install Python application and packaging tools
        shell: pwsh
        run: |
          micromamba run -n panligra-build python -m pip install --upgrade pip
          micromamba run -n panligra-build python -m pip install -r desktop/requirements-build.txt
          micromamba run -n panligra-build python -m pip install --no-deps plip==3.0.1
          micromamba run -n panligra-build python -c "import rdkit; import streamlit, plip, openbabel, cairo, gemmi, webview; from plip.structure.preparation import PDBComplex; print('Scientific and embedded UI dependencies import OK')"

      - name: Compile application
        shell: pwsh
        run: |
          micromamba run -n panligra-build python -m compileall -q app.py utils.py interactive_engine.py interaction_3d.py scientific_records.py rcsb_pdb.py desktop
          micromamba run -n panligra-build pyinstaller --noconfirm --clean desktop/PanLigra.spec
          if (!(Test-Path "dist/PanLigra/PanLigra.exe")) { throw "Executable missing" }
          micromamba run -n panligra-build python -c "import pefile; p=pefile.PE(r'dist/PanLigra/PanLigra.exe'); assert p.OPTIONAL_HEADER.Subsystem == 2, 'Expected Windows GUI subsystem'; print('GUI subsystem verified')"
          $files = Get-ChildItem "dist/PanLigra" -File -Recurse
          Write-Host "Largest frozen application files:"
          $files | Sort-Object Length -Descending | Select-Object -First 30 @{N="MB";E={[math]::Round($_.Length / 1MB, 1)}},FullName | Format-Table -AutoSize
          Write-Host ("Total frozen folder: {0:N1} MB" -f (($files | Measure-Object Length -Sum).Sum / 1MB))

      - name: Windows launch smoke test
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "$PWD/dist/PanLigra/PanLigra.exe" -ArgumentList "--panligra-internal-server" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/panligra.stdout.txt" -RedirectStandardError "$env:RUNNER_TEMP/panligra.stderr.txt"
          try {
            $ready = $false
            for ($i=0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 2
              if ($proc.HasExited) { break }
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:18763/_stcore/health" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) {
                  $home = Invoke-WebRequest -Uri "http://127.0.0.1:18763/" -UseBasicParsing -TimeoutSec 3
                  if ($home.StatusCode -eq 200 -and $home.Content.ToLowerInvariant().Contains("streamlit")) { $ready = $true; break }
                }
              } catch { }
            }
            if (!$ready) {
              Get-Content "$env:RUNNER_TEMP/panligra.stdout.txt" -ErrorAction SilentlyContinue
              Get-Content "$env:RUNNER_TEMP/panligra.stderr.txt" -ErrorAction SilentlyContinue
              throw "PanLigra did not start on localhost"
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Build user-level Windows installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if (!(Test-Path "dist/PanLigra/PanLigra.exe")) { throw "Bundled executable missing before installer packaging" }
          & "C:/Program Files (x86)/NSIS/makensis.exe" /NOCD "desktop/PanLigra.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS compiler failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "PanLigra-Setup.exe")) { throw "Installer missing" }
          $setup = Get-Item "PanLigra-Setup.exe"
          $distSize = (Get-ChildItem "dist/PanLigra" -File -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host ("Installer: {0:N1} MB; uncompressed app: {1:N1} MB" -f ($setup.Length / 1MB), ($distSize / 1MB))

      - name: Upload installer only
        uses: actions/upload-artifact@v4
        with:
          name: PanLigra-Windows-Setup
          path: PanLigra-Setup.exe
          if-no-files-found: error
          retention-days: 30
