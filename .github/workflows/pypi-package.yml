name: PyPI package
on:
  pull_request:
  push:
    branches: [feature/pypi-packaging, main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI (requires configured trusted publisher)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: |
          python -m pip install --no-deps dist/*.whl
          cd /tmp
          python -c "import panligra; from pathlib import Path; p=Path(panligra.__file__).parent; assert (p/'editor.html').is_file(); assert (p/'assets/panligra_logo_icon.png').is_file(); print(panligra.__version__)"
          panligra --version
          panligra-batch --help
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
